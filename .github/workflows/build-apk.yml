name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в GitHub

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        # Собираем fat APK (под все архитектуры сразу arm64, armeabi-v7a, x86_64)
        run: flutter build apk --release

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhitelistMonitor-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
