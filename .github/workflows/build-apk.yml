name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Recreate Android platform with v2 embedding
        run: |
          rm -rf android/
          flutter create . --platforms=android --org com.wonderfultech.netmonitor

      # Включаем core library desugaring для flutter_local_notifications
      - name: Enable Core Library Desugaring & Permissions
        run: |
          echo "android.builder.sdkDownload=false" >> android/gradle.properties
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          
          # Настраиваем desugaring в android/app/build.gradle
          sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"/' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Custom App Logo to Android Resources
        run: |
          if [ -f "assets/logo.png" ]; then
            echo "Generating Android launcher icons from assets/logo.png..."
            RES_DIR="android/app/src/main/res"
            mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi
            convert assets/logo.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher.png
            convert assets/logo.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher.png
            convert assets/logo.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher.png
            convert assets/logo.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
            convert assets/logo.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
            echo "Icons applied successfully!"
          else
            echo "assets/logo.png not found. Using default icon."
          fi

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhitelistMonitor-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
